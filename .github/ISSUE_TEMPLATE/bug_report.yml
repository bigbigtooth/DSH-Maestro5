name: Bug report
description: Report a defect in DSH Maestro5
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the issue.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: Which DeepSeek Harness version are you running? (Settings → About, or `dsh --version`)
      placeholder: "0.2.1-rc.2"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: DSH Maestro5 version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - npm
        - GitHub source
        - Local directory (link)
        - Web UI install
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. New session with mode “Team Lead”
        2. Ask “...”
        3. See ...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Host logs, browser console errors, screenshots. Do not paste API keys or personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I restarted DSH after installing or changing tier models
        - label: I searched existing issues before opening this one
