# 如何自定义（开发/高级用法）
# -----------------------------------------------------------------------------
# A. 改每档模型（推荐，普通用户）：设置 → 团队模式 → 选 Provider / 模型 /
#    思考强度 → 保存 → 重启 DSH Desktop 生效（模型列表来自 DSH 模型目录）。
#
# B. 改档位人设 / 工具集：修改对应 preset-team-l1 … preset-team-l5 的 plugins。
#
# C. 新增档位（如 L6）：
#    1) 复制 preset-team-l5 整段并改 id / config.id / name / description / order；
#    2) 在 team 的 delegation 区复制 delegate-l5，改 id / toolName / agentPreset /
#       agentOptionsFor('l6')；
#    3) 在 maestro-levels 的 levels 与 index.js 的 DEFAULT_LEVELS 里各加一行；
#    4) 重启 DSH Desktop。
#
# D. 生效方式：本插件以 link: 方式安装（源目录即安装物），改完文件后重启
#    DSH Desktop 最稳妥；改设置页里的模型同样重启后对新会话生效。
# =============================================================================
