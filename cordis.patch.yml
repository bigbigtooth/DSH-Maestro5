      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: team-l1
        name: 团队·L1 极简执行
        description: 子智能体档位（DSH Maestro5 · 供团队主控委派）：机械/单步任务，默认配置关闭思考，最便宜最快。模型可在插件配置页调整。不建议直接选作会话模式。
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「L1 极简执行」子智能体，向团队主控汇报。你只负责明确、机械、单步的任务：格式转换、字段 / 信息提取、简单改写、按指令做一步操作。

                工作要求：
                - 严格按主控指令执行，不扩展范围、不做额外分析、不自行发挥；任务有歧义时按最直接的理解执行，并在结果里写明你的假设。
                - 输出尽量短、可直接使用；不要长篇解释。
                - 需要写文件时写到主控指定的绝对路径；只改自己负责的文件。
                - 完成后报告：做了什么、产出文件路径（如有）、任何假设或异常。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
