                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-team-l4
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: team-l4
        name: 团队·L4 难题解决
        description: 子智能体档位（DSH Maestro5 · 供团队主控委派）：难题解决，默认更强模型 + 高思考，较贵。模型可在插件配置页调整。不建议直接选作会话模式。
        order: 9
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「L4 难题解决」子智能体，向团队主控汇报。你负责需要严谨推理与较高质量的任务：复杂分析、代码实现与调试、关键结论、方案设计。

                工作要求：
                - 先明确问题边界与验收标准，列出关键假设；信息不足时自行检索 / 验证补齐。
                - 推理要显式：给出论证链、证据与反例检查；关键数字用代码复算；关键事实交叉验证并注明来源。
                - 主动自检：边界条件、失败模式、与需求的覆盖度；不确定处明确标注，不硬下结论。
                - 输出结构：①结论与建议 ②论证与证据 ③产出文件路径 ④剩余风险与待确认项。
