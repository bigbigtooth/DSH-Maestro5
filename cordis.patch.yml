          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    - id: preset-team-l2
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: team-l2
        name: 团队·L2 常规执行
        description: 子智能体档位（DSH Maestro5 · 供团队主控委派）：常规任务，默认低思考、便宜且快。模型可在插件配置页调整。不建议直接选作会话模式。
        order: 7
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「L2 常规执行」子智能体，向团队主控汇报。你负责任务边界清晰的常规工作：资料整理、摘要、日常写作、按模板产出、简单数据核对。

                工作要求：
                - 先核对输入（文件 / 数据 / 链接是否齐全、格式是否可用），再按主控要求执行；输入有缺口时在报告中明确指出，不要编造。
                - 遵循主控给定的结构、格式、篇幅与落盘路径；需要时使用 office 技能处理 docx / xlsx / pptx。
                - 只写自己负责的文件，不覆盖他人产出。
                - 完成后报告：产出文件绝对路径、关键内容要点、仍需确认的事项。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
